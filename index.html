<div id="modal-root"></div>
<div id="toast-root"></div>

<!-- Chasiq footer: static blog link + collector-guides email signup (no JS framework deps) -->
<style>
.chq-foot{max-width:720px;margin:34px auto 0;padding:22px 16px 30px;text-align:center;border-top:1px solid var(--line)}
.chq-foot .chq-links{display:flex;justify-content:center;gap:18px;margin-bottom:18px;font-size:14px;font-weight:600}
.chq-foot .chq-links a{color:var(--mut)}
.chq-foot .chq-links a:hover{color:var(--acc)}
.chq-signup{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;max-width:480px;margin:0 auto}
.chq-signup h3{margin:0 0 4px;font-size:16px}
.chq-signup p{margin:0 0 12px;font-size:13px;color:var(--mut)}
.chq-signup .row{display:flex;gap:8px}
.chq-signup input{flex:1;min-width:0;padding:10px 12px;font-size:14px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);color:var(--txt)}
.chq-signup input::placeholder{color:var(--mut2)}
.chq-signup button{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#1a1206;font-weight:800;padding:10px 16px;border-radius:10px;border:0;cursor:pointer;font-size:14px;white-space:nowrap}
.chq-signup .note{font-size:12px;margin:8px 0 0;min-height:16px;color:var(--ok)}
@media(max-width:520px){.chq-signup .row{flex-direction:column}}
</style>
<footer class="chq-foot">
<div class="chq-links">
<a href="/blog/">📚 Collector Guides</a>
<a href="/brands/hot-wheels.html">Catalog by brand</a>
</div>
<div class="chq-signup">
<h3>Get collector guides</h3>
<p>Organizing tips, cataloging systems, hunt strategies — straight to your inbox.</p>
<form id="chq-foot-signup" novalidate>
<div class="row">
<input type="email" name="email" placeholder="Email address" autocomplete="email" aria-label="Email address" required>
<button type="submit">Sign up</button>
</div>
<p class="note" id="chq-foot-msg" aria-live="polite"></p>
</form>
</div>
</footer>
<script>
(function(){
var f=document.getElementById('chq-foot-signup');if(!f)return;
f.addEventListener('submit',async function(e){
e.preventDefault();
var msg=document.getElementById('chq-foot-msg');
var email=(new FormData(f).get('email')||'').toString().trim();
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){msg.style.color='#ff5a5a';msg.textContent='Please enter a valid email address.';return;}
msg.style.color='#9aa7bb';msg.textContent='Signing you up…';
try{
var r=await fetch('https://formsubmit.co/ajax/dandrsalesllc@gmail.com',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({email:email,_subject:'Chasiq blog signup'})});
var d=await r.json();
if(r.ok&&(d.success==='true'||d.success===true)){msg.style.color='#3ddc84';msg.textContent='Thanks — you\u2019re on the list!';f.querySelector('input').value='';}
else{throw new Error('x');}
}catch(err){msg.style.color='#ff5a5a';msg.textContent='Something went wrong — try again in a moment.';}
});
})();
</script>
